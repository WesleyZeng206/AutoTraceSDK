[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrace-ml"
version = "0.1.0"
description = "AutoTrace ML observability SDK"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.18"]

[tool.setuptools.packages.find]
where = ["."]
include = ["autotrace_ml*"]
